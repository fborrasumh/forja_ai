<!DOCTYPE html>
<html lang="es">
<head>
<script id="gpt6-luna-shim">
/* gpt-6-luna: modelo por defecto con temperatura=1 (actualización sep-2026).
   Adapta las peticiones a la API de OpenAI para la familia gpt-6:
   temperature=1, max_tokens -> max_completion_tokens (con margen para razonamiento)
   y reintento automático si la API rechaza algún parámetro. */
(function(){
  var NEW='gpt-6-luna', OLD='gpt-4o-mini';
  try{
    if(!localStorage.getItem('__gpt6_luna_mig_v1')){
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i), v=localStorage.getItem(k);
        if(v===OLD||v==='"'+OLD+'"'){ localStorage.setItem(k, v.replace(OLD,NEW)); continue; }
        if(v && v.length<20000 && v.charAt(0)==='{' && v.indexOf(OLD)>=0){
          try{ var o=JSON.parse(v), ch=false;
            for(var p in o){ if(o[p]===OLD){ o[p]=NEW; ch=true; } }
            if(ch) localStorage.setItem(k, JSON.stringify(o));
          }catch(e){}
        }
      }
      localStorage.setItem('__gpt6_luna_mig_v1','1');
    }
  }catch(e){}
  var of=window.fetch; if(!of) return;
  function adapt(url,b){
    if(!b || typeof b.model!=='string' || !/^gpt-6/.test(b.model)) return false;
    b.temperature=1;
    ['top_p','frequency_penalty','presence_penalty','logit_bias','logprobs','top_logprobs'].forEach(function(p){ delete b[p]; });
    if(/chat\/completions/.test(url) && b.max_tokens!=null){
      if(b.max_completion_tokens==null) b.max_completion_tokens=Math.min(128000, (+b.max_tokens||0)+6000);
      delete b.max_tokens;
    }
    return true;
  }
  window.fetch=function(input,init){
    var url=typeof input==='string'?input:(input&&input.url)||'';
    if(!/api\.openai\.com\/v1\/(chat\/completions|responses)/.test(url) || !init || typeof init.body!=='string') return of.apply(this,arguments);
    var b; try{ b=JSON.parse(init.body); }catch(e){ return of.apply(this,arguments); }
    if(!adapt(url,b)) return of.apply(this,arguments);
    var self=this, tries=0;
    function go(){
      var ini=Object.assign({},init,{body:JSON.stringify(b)});
      return of.call(self,input,ini).then(function(r){
        if(r.status!==400 || tries>=3) return r;
        return r.clone().json().then(function(j){
          var err=(j&&j.error)||{}, p=err.param, msg=String(err.message||'');
          if(!p){ var m=msg.match(/'([a-z_]+)'/); if(m) p=m[1]; }
          if(p && b.hasOwnProperty(p) && /unsupported|not supported|does not support|only the default/i.test(msg)){
            delete b[p]; tries++; return go();
          }
          return r;
        },function(){ return r; });
      });
    }
    return go();
  };
})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --tinta:#0F2237; --acero:#2E4B6B; --acero-claro:#7C93AC; --gris:#5D7691;
  --papel:#F3F6FA; --blanco:#FFFFFF; --linea:#D8E0E9; --linea-2:#E8EEF4;
  --brasa:#E4572E; --brasa-osc:#C9441F; --brasa-suave:#FDEBE4;
  --forjado:#0E7C6B; --forjado-suave:#E0F3EE;
  --aviso:#8A3617;
  --c-gen:#E4572E; --c-chat:#0E8C7A; --c-quiz:#6B4FD8; --c-tarj:#C98200; --c-feyn:#1F6FB2;
  --sombra:0 1px 0 rgba(15,34,55,.05), 0 14px 34px -22px rgba(15,34,55,.45);
  --sombra-alta:0 2px 0 rgba(15,34,55,.04), 0 22px 50px -24px rgba(15,34,55,.55);
  --r:14px;
  --display:"Bricolage Grotesque",Georgia,serif;
  --texto:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--papel);color:var(--tinta);font-family:var(--texto);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:84px}
a{color:var(--acero)}
:focus-visible{outline:3px solid var(--brasa);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
.mono{font-family:var(--mono);font-size:.88em}
svg.i{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ── Barra superior ───────────────────────── */
.topbar{position:sticky;top:0;z-index:40;background:var(--tinta);color:#EAF1F7;box-shadow:0 6px 24px -14px rgba(0,0,0,.6)}
.tb-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.logo{background:none;border:0;color:#fff;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.03em;cursor:pointer;padding:2px 4px;display:flex;align-items:center;gap:8px}
.logo em{font-style:normal;color:var(--brasa)}
.logo .anv{width:30px;height:30px;border-radius:9px;background:var(--brasa);display:grid;place-items:center;color:#fff}
.stepper{flex:1;display:flex;align-items:center;justify-content:center;gap:0;min-width:0}
.sdot{display:flex;align-items:center;gap:7px;background:none;border:0;color:#8FA7BE;font:600 13px var(--texto);padding:6px 6px;cursor:pointer;border-radius:10px;white-space:nowrap}
.sdot:disabled{cursor:not-allowed;opacity:.45}
.sdot .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid #3E5C7D;font-size:12px;background:transparent;color:#A9C0D4;transition:all .2s}
.sdot .n svg{width:14px;height:14px}
.sdot[data-state="done"] .n{background:var(--forjado);border-color:var(--forjado);color:#fff}
.sdot[data-state="now"]{color:#fff}
.sdot[data-state="now"] .n{background:var(--brasa);border-color:var(--brasa);color:#fff;box-shadow:0 0 0 4px rgba(228,87,46,.25)}
.sdot:not(:disabled):hover{background:rgba(255,255,255,.06)}
.sline{flex:0 1 26px;height:2px;background:#2F4A68;min-width:6px}
.sline.on{background:var(--forjado)}
.tb-tools{display:flex;align-items:center;gap:6px}
.tb-btn{background:transparent;border:1px solid #3E5C7D;color:#C9D8E6;border-radius:9px;padding:6px 10px;font:600 13px var(--texto);cursor:pointer;display:flex;align-items:center;gap:6px}
.tb-btn:hover{border-color:var(--brasa);color:#fff}
.lang{display:flex;gap:3px}
.lang-b{background:transparent;border:1px solid #3E5C7D;color:#A9C0D4;font:700 11.5px var(--texto);padding:6px 8px;border-radius:8px;cursor:pointer;letter-spacing:.05em}
.lang-b[aria-pressed="true"]{background:var(--brasa);border-color:var(--brasa);color:#fff}
.progress{height:4px;background:#1E3550}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brasa),#F59E0B);transition:width .4s}
@media(max-width:1020px){.sdot .lbl{display:none}.sdot[data-state="now"] .lbl{display:inline}}
@media(max-width:720px){
  .tb-in{flex-wrap:wrap;gap:8px}
  .stepper{order:3;flex-basis:100%;justify-content:space-between}
  .sdot[data-state="now"] .lbl{display:none}
  .tb-btn .lbl{display:none}
}

/* ── Pantallas ────────────────────────────── */
main{max-width:1240px;margin:0 auto;padding:26px 16px 40px}
.screen{display:none}
.screen.on{display:block}
@media(prefers-reduced-motion:no-preference){.screen.on{animation:rise .35s cubic-bezier(.2,.7,.3,1) both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}}
.sh{display:flex;gap:18px;align-items:flex-start;margin:4px 0 22px}
.sh-ico{width:64px;height:64px;border-radius:18px;background:var(--c,var(--brasa));color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 12px 24px -14px var(--c,var(--brasa))}
.sh-ico svg{width:32px;height:32px}
.sh-step{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acero-claro);margin:4px 0 4px}
.sh h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,3.6vw,38px);letter-spacing:-.025em;line-height:1.05;margin:0 0 6px}
.sh-lede{margin:0;color:var(--gris);font-size:16.5px;max-width:70ch}
@media(max-width:600px){.sh-ico{width:48px;height:48px;border-radius:14px}.sh-ico svg{width:24px;height:24px}}

.card{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);box-shadow:var(--sombra);padding:20px;margin-bottom:18px}
.card h3{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:0 0 4px;display:flex;align-items:center;gap:9px}
.card h3 .num{width:26px;height:26px;border-radius:8px;background:var(--tinta);color:#fff;font:700 13px var(--mono);display:grid;place-items:center}
.card .sub{margin:0 0 14px;color:var(--gris);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}

label,.lab{display:block;font-size:13.5px;font-weight:600;margin:0 0 6px;color:var(--acero)}
.lab small,label small{font-weight:500;color:var(--acero-claro)}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;padding:11px 13px;border:1.5px solid var(--linea);border-radius:10px;font-family:var(--texto);font-size:15px;color:var(--tinta);background:#fff;transition:border-color .15s, box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acero-claro);box-shadow:0 0 0 4px rgba(124,147,172,.18)}
textarea{resize:vertical;min-height:96px;line-height:1.5}
input::placeholder,textarea::placeholder{color:#9DB0C2}
.field{margin-bottom:14px}
.help{font-size:12.8px;color:var(--gris);margin:6px 0 0}

button{font-family:var(--texto);cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:11px;font-weight:600;font-size:15px;border:1.5px solid transparent;padding:11px 18px;transition:transform .08s, background .15s, border-color .15s;text-decoration:none;line-height:1.2}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brasa);color:#fff;box-shadow:0 8px 18px -10px var(--brasa)}
.btn-primary:hover{background:var(--brasa-osc)}
.btn-primary:disabled{background:#C8D3DD;box-shadow:none;cursor:not-allowed}
.btn-big{font-size:17px;padding:14px 24px;border-radius:13px}
.btn-dark{background:var(--tinta);color:#fff}
.btn-dark:hover{background:#1c3656}
.btn-ghost{background:#fff;border-color:var(--linea);color:var(--acero)}
.btn-ghost:hover{border-color:var(--acero-claro);background:#F7FAFC}
.btn-ok{background:var(--forjado);color:#fff}
.btn-sm{padding:7px 12px;font-size:13.5px;border-radius:9px}
.btn:disabled{opacity:.6;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{font-size:14px;color:var(--gris)}
.status[data-kind="err"]{color:var(--brasa);font-weight:600}
.status[data-kind="ok"]{color:var(--forjado);font-weight:600}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#fff;border:1.5px solid var(--linea);border-radius:999px;padding:7px 13px;font-size:13.5px;color:var(--acero);cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.25;text-align:left}
.chip:hover{border-color:var(--brasa);color:var(--brasa)}
.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.chip .tag{font-size:11px;font-weight:700;color:var(--acero-claro)}
.chip[aria-pressed="true"] .tag{color:#A9C0D4}

.tip{display:flex;gap:12px;background:#FFF8E6;border:1px solid #F3DDA0;border-radius:12px;padding:13px 15px;font-size:14px;color:#6B4E00;margin-bottom:18px}
.tip svg{width:22px;height:22px;color:#C98200;flex:none;margin-top:1px}
.tip strong{color:#523B00}
.aviso{background:var(--brasa-suave);border:1px solid #F3C7B5;border-radius:12px;padding:13px 15px;font-size:14px;color:var(--aviso);margin-bottom:16px}
.okbox{background:var(--forjado-suave);border:1px solid #A9DCCF;border-radius:12px;padding:13px 15px;font-size:14px;color:#0B5A4E;margin-bottom:16px}

/* ── Inicio ───────────────────────────────── */
.hero{background:var(--tinta);color:#EAF1F7;border-radius:22px;padding:40px 36px;position:relative;overflow:hidden;margin-bottom:26px;box-shadow:var(--sombra-alta)}
.hero::before{content:"";position:absolute;right:-80px;top:-80px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(228,87,46,.55),transparent 65%)}
.hero::after{content:"";position:absolute;left:30%;bottom:-140px;width:420px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(14,140,122,.35),transparent 65%)}
.hero > *{position:relative;z-index:1}
@media(max-width:600px){.hero{padding:28px 20px;border-radius:18px}.hero p.lede{font-size:16px}}
.eyebrow{font:600 11.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#8FA7BE;margin:0 0 14px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,5.6vw,62px);line-height:.98;letter-spacing:-.035em;margin:0 0 16px;max-width:17ch}
.hero h1 em{font-style:normal;color:var(--brasa)}
.hero p.lede{max-width:60ch;font-size:18px;color:#C3D3E2;margin:0 0 24px}
.hero .actions .btn-ghost{background:transparent;color:#fff;border-color:#4A6787}
.hero .actions .btn-ghost:hover{border-color:#fff}
.draft{margin-top:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14.5px}
.sec-title{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin:34px 0 6px}
.sec-sub{color:var(--gris);margin:0 0 16px}
.journey{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;counter-reset:j}
.jstop{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:14px;position:relative;cursor:pointer;text-align:left;font:inherit;color:inherit}
.jstop:hover{border-color:var(--brasa);transform:translateY(-2px);transition:transform .15s}
.jstop .ji{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--c);margin-bottom:10px}
.jstop .ji svg{width:20px;height:20px}
.jstop b{display:block;font-size:14.5px}
.jstop span{display:block;font-size:12.5px;color:var(--gris);line-height:1.4}
.jstop .jn{position:absolute;top:10px;right:12px;font:700 12px var(--mono);color:var(--acero-claro)}
@media(max-width:1020px){.journey{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.journey{grid-template-columns:1fr 1fr}}

/* Tipos de app */
.types{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
@media(max-width:1100px){.types{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.types{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.types{grid-template-columns:1fr}}
.tcard{background:#fff;border:2px solid var(--linea);border-radius:18px;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;font:inherit;color:inherit;transition:transform .15s,border-color .15s, box-shadow .15s;position:relative}
.tcard:hover{transform:translateY(-3px);box-shadow:var(--sombra-alta);border-color:var(--c)}
.tcard[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent),var(--sombra-alta)}
.tcard .tsel{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:none;place-items:center;z-index:2}
.tcard[aria-pressed="true"] .tsel{display:grid}
.tmock{height:118px;background:color-mix(in srgb,var(--c) 10%,#fff);display:grid;place-items:center;border-bottom:1px solid var(--linea-2);position:relative;overflow:hidden}
.tbody{padding:14px 15px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.tname{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.tname .ti{width:30px;height:30px;border-radius:9px;background:var(--c);color:#fff;display:grid;place-items:center}
.tname .ti svg{width:16px;height:16px}
.tdesc{font-size:13.8px;color:var(--acero);margin:0}
.tideal{font-size:12.3px;color:var(--gris);margin:4px 0 0}
.tideal b{color:var(--c);font-weight:700}
/* mini-mockups */
.mk{width:78%;display:flex;flex-direction:column;gap:6px}
.mk .b{height:14px;border-radius:8px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mk .b.me{align-self:flex-end;background:var(--c);width:58%}
.mk .b.it{width:72%}
.mk .ln{height:7px;border-radius:4px;background:color-mix(in srgb,var(--c) 30%,#fff)}
.mk .op{height:15px;border-radius:6px;background:#fff;border:1.5px solid color-mix(in srgb,var(--c) 30%,#fff);display:flex;align-items:center;padding-left:6px}
.mk .op i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--c)}
.mk .op.ok{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff)}
.mk .op.ok i{background:var(--c)}
.mkcards{position:relative;width:96px;height:76px}
.mkcards span{position:absolute;inset:0;border-radius:10px;background:#fff;box-shadow:0 4px 12px -4px rgba(0,0,0,.25);border:1.5px solid color-mix(in srgb,var(--c) 35%,#fff)}
.mkcards span:nth-child(1){transform:rotate(-9deg) translate(-8px,4px)}
.mkcards span:nth-child(2){transform:rotate(5deg) translate(8px,2px)}
.mkcards span:nth-child(3){display:grid;place-items:center;font:800 26px var(--display);color:var(--c)}
.mkdoc{width:70%;background:#fff;border-radius:8px;padding:10px;box-shadow:0 4px 12px -6px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:5px}
.mkdoc .ln{height:7px;border-radius:4px;background:color-mix(in srgb,var(--c) 30%,#fff)}
.mkdoc .h{height:9px;width:55%;border-radius:4px;background:var(--c)}
.mkfey{display:flex;align-items:flex-end;gap:10px}
.mkfey .bulb{width:40px;height:40px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff}
.mkfey .bars{display:flex;gap:5px;align-items:flex-end;height:54px}
.mkfey .bars i{width:11px;border-radius:4px 4px 0 0;background:color-mix(in srgb,var(--c) 45%,#fff)}
.mkfey .bars i:last-child{background:var(--c)}

/* Ejemplos */
.examples{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.excard{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sombra);position:relative;overflow:hidden}
.excard::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--c)}
.excard .emo{font-size:34px;line-height:1}
.excard .area{font:700 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--acero-claro)}
.excard b{font-family:var(--display);font-size:18px;letter-spacing:-.01em}
.excard p{margin:0;font-size:13.5px;color:var(--gris);flex:1}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);border-radius:999px;padding:3px 9px;align-self:flex-start}
.badge svg{width:13px;height:13px}

/* Clave */
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1;font-family:var(--mono);font-size:14px}
.eye{width:46px;flex:none;border:1.5px solid var(--linea);background:#fff;border-radius:10px;color:var(--acero);display:grid;place-items:center}
.light{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--papel);margin-top:14px;font-size:14.5px;font-weight:600}
.light .bulbo{width:14px;height:14px;border-radius:50%;background:#B8C5D3;box-shadow:0 0 0 4px rgba(184,197,211,.3)}
.light[data-s="ok"] .bulbo{background:#16A34A;box-shadow:0 0 0 4px rgba(22,163,74,.22)}
.light[data-s="err"] .bulbo{background:var(--brasa);box-shadow:0 0 0 4px rgba(228,87,46,.22)}
.light[data-s="wait"] .bulbo{background:#F59E0B;box-shadow:0 0 0 4px rgba(245,158,11,.25)}
.olsteps{list-style:none;padding:0;margin:0;counter-reset:o;display:flex;flex-direction:column;gap:12px}
.olsteps li{counter-increment:o;display:flex;gap:12px;font-size:14.5px;align-items:flex-start}
.olsteps li::before{content:counter(o);width:28px;height:28px;border-radius:50%;background:var(--brasa-suave);color:var(--brasa);font:700 13px var(--mono);display:grid;place-items:center;flex:none}

/* Describe */
.typebar{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--c);border-radius:14px;padding:10px 14px;margin-bottom:18px}
.typebar .ti{width:38px;height:38px;border-radius:11px;background:var(--c);color:#fff;display:grid;place-items:center}
.typebar b{font-family:var(--display);font-size:17px}
.typebar span{font-size:13.5px;color:var(--gris)}
.typebar .btn{margin-left:auto}
.guide{background:var(--papel);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--acero)}
.guide ul{margin:6px 0 0;padding-left:18px}
.meter{display:flex;flex-direction:column;gap:8px}
.meter-bar{height:10px;border-radius:6px;background:var(--linea-2);overflow:hidden}
.meter-bar span{display:block;height:100%;width:0;border-radius:6px;transition:width .3s, background .3s;background:var(--brasa)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12.5px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--linea-2);color:var(--gris);display:inline-flex;gap:5px;align-items:center}
.pill.on{background:var(--forjado-suave);color:var(--forjado)}
.pill svg{width:13px;height:13px}
.forging{display:none;align-items:center;gap:14px;padding:16px;border-radius:14px;background:var(--tinta);color:#fff;margin-top:14px}
.forging.on{display:flex}
.spark{width:44px;height:44px;border-radius:12px;background:var(--brasa);display:grid;place-items:center;animation:pulse 1s infinite alternate}
@keyframes pulse{from{transform:scale(1);box-shadow:0 0 0 0 rgba(228,87,46,.6)}to{transform:scale(1.06);box-shadow:0 0 0 12px rgba(228,87,46,0)}}

/* Ajusta */
.ajusta{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.pvsticky{position:sticky;top:96px}
@media(max-width:1000px){.ajusta{grid-template-columns:1fr}.pvsticky{position:static}}
.acc{background:#fff;border:1px solid var(--linea);border-radius:var(--r);margin-bottom:12px;box-shadow:var(--sombra);overflow:hidden}
.acc>summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;align-items:center;gap:12px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .ai{width:36px;height:36px;border-radius:10px;background:var(--papel);color:var(--acero);display:grid;place-items:center;flex:none}
.acc[open]>summary .ai{background:var(--tinta);color:#fff}
.acc>summary b{font-family:var(--display);font-size:17px;display:block}
.acc>summary small{display:block;color:var(--gris);font-size:13px}
.acc>summary .chev{margin-left:auto;transition:transform .2s;color:var(--acero-claro)}
.acc[open]>summary .chev{transform:rotate(180deg)}
.acc .inner{padding:4px 18px 18px;border-top:1px solid var(--linea-2)}
.acc .inner>.field:first-child,.acc .inner>*:first-child{margin-top:14px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--linea);cursor:pointer;background:var(--c)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--tinta)}
.emojis{display:flex;gap:4px;flex-wrap:wrap}
.emo-b{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--linea);background:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center;padding:0}
.emo-b[aria-pressed="true"]{border-color:var(--tinta);background:var(--papel);box-shadow:0 0 0 2px var(--tinta)}
.campo{border:1.5px solid var(--linea);border-radius:12px;padding:12px;margin-bottom:10px;background:#FBFDFE}
.campo-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.campo-top .n{font:700 11.5px var(--mono);color:var(--acero-claro);letter-spacing:.1em}
.campo-top .sp{flex:1}
.mini{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--linea);background:#fff;color:var(--acero);display:grid;place-items:center;padding:0}
.mini:hover{border-color:var(--brasa);color:var(--brasa)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.seg button{border:1.5px solid var(--linea);background:#fff;border-radius:9px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--acero);display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--acero);font-weight:500;cursor:pointer}
.check input{width:18px;height:18px;margin:0;accent-color:var(--forjado)}
.pvbox{background:#fff;border:1px solid var(--linea);border-radius:16px;overflow:hidden;box-shadow:var(--sombra-alta)}
.pvbar{display:flex;align-items:center;gap:7px;padding:9px 12px;background:var(--tinta)}
.pvbar .dot{width:10px;height:10px;border-radius:50%;background:#4A6787}
.pvbar .dot:nth-child(1){background:#F26B5B}.pvbar .dot:nth-child(2){background:#F5BF4F}.pvbar .dot:nth-child(3){background:#5CC77B}
.pvurl{flex:1;font:12px var(--mono);color:#A9C0D4;background:#1B3350;border-radius:7px;padding:5px 10px;margin-left:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pvbar .tb-btn{padding:4px 8px}
.pvframe{background:#E9EEF3;display:flex;justify-content:center}
.pvframe iframe{width:100%;height:640px;border:0;display:block;background:#fff;transition:width .3s}
.pvframe[data-dev="tab"] iframe{width:768px;max-width:100%}
.pvframe[data-dev="mob"] iframe{width:390px;max-width:100%}
.pvnote{font-size:12.8px;color:var(--gris);padding:9px 14px;background:var(--papel);border-top:1px solid var(--linea-2)}

/* Prueba / publica */
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checklist label{display:flex;gap:10px;align-items:flex-start;font-weight:500;color:var(--tinta);font-size:14.5px;padding:10px 12px;border-radius:10px;background:var(--papel);margin:0;cursor:pointer}
.checklist input{width:19px;height:19px;accent-color:var(--forjado);margin-top:2px;flex:none}
.checklist label:has(input:checked){background:var(--forjado-suave);color:#0B5A4E}
.timeline{position:relative;padding-left:0}
.tstage{display:grid;grid-template-columns:56px 1fr;gap:16px;position:relative;padding-bottom:22px}
.tstage::before{content:"";position:absolute;left:27px;top:56px;bottom:0;width:2px;background:var(--linea)}
.tstage:last-child::before{display:none}
.tstage .tsi{width:56px;height:56px;border-radius:16px;background:var(--c);color:#fff;display:grid;place-items:center;box-shadow:0 10px 20px -12px var(--c)}
.tstage .tsi svg{width:26px;height:26px}
.tstage .card{margin-bottom:0}
.steps{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border-radius:11px;background:var(--papel);font-size:14.5px}
.steps li input{width:20px;height:20px;accent-color:var(--forjado);flex:none;margin-top:1px}
.steps li.done{background:var(--forjado-suave)}
.steps li .st{flex:1}
.steps li .st a.go{font-weight:700;white-space:nowrap}
.kbd{font:600 12.5px var(--mono);background:#fff;border:1px solid var(--linea);border-bottom-width:2px;border-radius:6px;padding:1px 6px;white-space:nowrap}
.url-big{font:600 15px var(--mono);background:var(--tinta);color:#9FE3D4;padding:12px 14px;border-radius:11px;word-break:break-all;display:flex;gap:10px;align-items:center;justify-content:space-between}
.url-big a{color:#9FE3D4}
.cite{font-size:14px;background:var(--papel);border-left:4px solid var(--forjado);padding:12px 14px;border-radius:8px}
.party{display:none;text-align:center;padding:26px;border-radius:18px;background:linear-gradient(135deg,var(--forjado),#1F6FB2);color:#fff;margin-top:6px}
.party.on{display:block}
.party b{font-family:var(--display);font-size:28px;display:block}
pre.code{background:var(--tinta);color:#CFE0EE;padding:16px;border-radius:10px;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.6;max-height:340px;margin:0}

/* Navegación inferior */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--linea)}
.bn-in{max-width:1240px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.bn-hint{flex:1;text-align:center;font-size:14px;color:var(--gris)}
.bn-hint b{color:var(--tinta)}
@media(max-width:600px){.bn-hint{display:none}.bn-in{justify-content:space-between}}

/* Glosario / modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,34,55,.55);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.modal.on{display:flex}
.modal-box{background:#fff;border-radius:18px;max-width:760px;width:100%;box-shadow:var(--sombra-alta);overflow:hidden}
.modal-head{display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--tinta);color:#fff}
.modal-head h2{font-family:var(--display);font-size:22px;margin:0;flex:1}
.modal-head button{background:transparent;border:1px solid #4A6787;color:#fff;border-radius:9px;padding:6px 10px}
.modal-body{padding:18px 20px 22px}
.glos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.glos{grid-template-columns:1fr}}
.glos div{background:var(--papel);border-radius:12px;padding:12px 14px}
.glos b{display:block;font-family:var(--display);font-size:16px;margin-bottom:2px}
.glos span{font-size:13.8px;color:var(--acero)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--tinta);color:#fff;padding:11px 18px;border-radius:12px;font-size:14.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:70;max-width:90vw;text-align:center;box-shadow:var(--sombra-alta)}
.toast.on{opacity:1;transform:translateX(-50%)}
footer{max-width:1240px;margin:0 auto;padding:0 16px 30px;font-size:13px;color:#6E8299}
footer hr{border:0;border-top:1px solid var(--linea);margin:0 0 14px}
</style>
</head>

        log.appendChild(el('div', 'bub ' + (m.r === 'u' ? 'me' : 'bot'), m.r === 'u' ? esc(m.t).replace(/\n/g,'<br>') : md(m.t)));

      if(ocupadoC) log.appendChild(el('div', 'typing', '<span class="spin"></span>' + esc(u.typing)));
      log.scrollTop = log.scrollHeight;
      var sg = $('sugs'); sg.innerHTML = '';
      var sug = C().sugerencias || [];
      if(!terminado && vis.filter(function(m){ return m.r === 'u'; }).length === 0){
        sug.forEach(function(x){ var b = el('button', 'sug'); b.type = 'button'; b.textContent = x; b.onclick = function(){ envia(x); }; sg.appendChild(b); });
      }
      var ev = vis.filter(function(m){ return m.r === 'eval'; })[0], outE = $('stage').querySelector('.out');
      if(ev && outE){ outE.innerHTML = '<h2>🏁 ' + esc(u.evalT) + '</h2>' + md(ev.t); outE.classList.remove('hide'); }
      $('inp').disabled = terminado || ocupadoC; $('sendB').disabled = terminado || ocupadoC; $('endB').disabled = terminado || ocupadoC;
    }
    function cmsg(t, k){ var m = $('cmsg'); if(m){ m.textContent = t; m.className = 'msg' + (k ? ' ' + k : ''); } }
    function llamar(extraUser){
      ocupadoC = true; pintaLog();
      var msgs = extraUser ? hist.concat([{role:'user', content: extraUser}]) : hist;
      return api(msgs, {max: 1800}).then(function(t){ ocupadoC = false; return t; }, function(e){ ocupadoC = false; pintaLog(); cmsg(errMsg(e), 'err'); throw e; });
    }
    function inicia(contexto){
      ctx = contexto; terminado = false; vis = [];
      hist = [{role:'system', content: sistema(REGLAS, ctx)}];
      monta();
      var bv = C().bienvenida;
      if(bv && !ctx){ hist.push({role:'assistant', content: bv}); vis.push({r:'b', t: bv}); pintaLog(); return; }
      hist.push({role:'user', content: T().kick});
      llamar().then(function(t){ hist.push({role:'assistant', content: t}); vis.push({r:'b', t: t}); pintaLog(); }).catch(function(){});
    }
    function envia(txt){
      txt = String(txt || '').trim(); if(!txt || terminado || ocupadoC) return;
      $('inp').value = ''; cmsg('');
      hist.push({role:'user', content: txt}); vis.push({r:'u', t: txt});
      llamar().then(function(t){ hist.push({role:'assistant', content: t}); vis.push({r:'b', t: t}); pintaLog(); $('inp').focus(); })
        .catch(function(){ hist.pop(); vis.pop(); pintaLog(); $('inp').value = txt; });
    }
    function termina(){
      if(vis.filter(function(m){ return m.r === 'u'; }).length < 2){ cmsg(T().needMore, 'err'); return; }
      var instr = SPEC.evaluacion || 'La conversación ha terminado. Sal del personaje y ofrece una devolución formativa estructurada.';
      llamar('[FIN DE LA SESIÓN] ' + instr).then(function(t){
        terminado = true; vis.push({r:'eval', t: t}); pintaLog();
        var o = $('stage').querySelector('.out'); if(o) o.scrollIntoView({behavior:'smooth', block:'start'});
      }).catch(function(){});
    }
    $('run').onclick = function(){
      var d = recoge(); if(!d) return;
      say('', ''); $('setup').classList.add('hide'); inicia(d.texto);
    };
    MODO.repinta = function(){ if($('log')) monta(); };
    if(!SPEC.campos.length) setTimeout(function(){ inicia(''); }, 0);
  }

  /* 3 · CUESTIONARIO */
  function modoQuiz(){
    var P = [], idx = 0, resp = [];
    function formato(n){
      var f = (SPEC.opciones && SPEC.opciones.formato) || 'multiple';
      var tipo = f === 'vf' ? ' de verdadero o falso: "opciones" contiene exactamente dos elementos, «Verdadero» y «Falso» en el idioma de respuesta'
        : f === 'mixta' ? ' combinando opción múltiple (4 opciones) y verdadero/falso (2 opciones)' : ' de opción múltiple con 4 opciones cada una';
      return 'Genera exactamente ' + n + ' preguntas' + tipo + '. Devuelve EXCLUSIVAMENTE un objeto JSON con esta forma: {"preguntas":[{"enunciado":"","opciones":["",""],"correcta":0,"explicacion":""}]}. "correcta" es el índice, empezando en 0, de la única opción correcta. Reparte la posición de la respuesta correcta. Sin markdown dentro de los textos.';
    }
    function pregunta(){
      var s = stageClear(), u = T(), p = P[idx];
      var card = el('div', 'card');
      card.innerHTML = '<div class="qtop"><span>' + esc(u.q) + ' ' + (idx + 1) + ' ' + esc(u.of) + ' ' + P.length + '</span><span class="sp"></span><span>✓ ' + resp.filter(function(r){ return r.ok; }).length + '</span></div>'
        + '<div class="bar"><span style="width:' + Math.round(idx / P.length * 100) + '%"></span></div>'
        + '<h2 class="qtext">' + inl(p.enunciado) + '</h2><div class="opts" id="opts"></div><div class="fb hide" id="fb"></div>'
        + '<div class="row"><button class="go hide" type="button" id="qNext">' + esc(idx + 1 < P.length ? u.next : u.finish) + ' →</button></div>';
      s.appendChild(card);
      var opts = $('opts');
      p.opciones.forEach(function(o, k){
        var b = el('button', 'opt', '<span class="lt">' + String.fromCharCode(65 + k) + '</span><span>' + inl(o) + '</span>'); b.type = 'button';
        b.onclick = function(){
          var ok = k === p.correcta;
          resp[idx] = {elegida: k, ok: ok};
          Array.prototype.forEach.call(opts.children, function(x, j){ x.disabled = true; if(j === p.correcta) x.classList.add('right'); else if(j === k) x.classList.add('wrong'); });
          var fb = $('fb'); fb.className = 'fb ' + (ok ? 'good' : 'bad');
          fb.innerHTML = '<b>' + (ok ? '✅ ' + esc(u.correct) : '❌ ' + esc(u.wrong)) + '</b>' + (ok ? '' : esc(u.rightIs) + '<strong>' + inl(p.opciones[p.correcta]) + '</strong><br>') + inl(p.explicacion || '');
          $('qNext').classList.remove('hide'); $('qNext').focus();
        };
        opts.appendChild(b);
      });
      $('qNext').onclick = function(){ idx++; if(idx < P.length) pregunta(); else resultado(); };
      card.scrollIntoView({behavior:'smooth', block:'start'});
    }
    function resultado(){
      var s = stageClear(), u = T();
      var ok = resp.filter(function(r){ return r && r.ok; }).length, pct = Math.round(ok / P.length * 100);
      var band = pct >= 80 ? u.band2 : pct >= 50 ? u.band1 : u.band0;
      var card = el('div', 'card');
      var html = '<h2 style="text-align:center;margin:0 0 8px">' + esc(u.score) + '</h2><div class="ring" style="--v:' + pct + '"><span>' + ok + '/' + P.length + '</span></div>'
        + '<p style="text-align:center;font-size:17px;margin:0 0 16px">' + esc(band) + '</p>'
        + '<div class="row center noprint" style="margin-bottom:12px"><button class="go" type="button" id="qNew">' + esc(u.newQ) + '</button><button class="gh" type="button" id="qRetry">' + esc(u.retry) + '</button><button class="gh" type="button" id="qDl">' + esc(u.dlRes) + '</button><button class="gh" type="button" id="qPr">' + esc(u.print) + '</button></div>'
        + '<h3>' + esc(u.review) + '</h3>';
      P.forEach(function(p, i){
        var r = resp[i] || {};
        html += '<div class="rev"><b>' + (i + 1) + '. </b>' + inl(p.enunciado) + '<br><span class="' + (r.ok ? 'ok' : 'ko') + '">' + (r.ok ? '✓ ' : '✗ ') + esc(u.yours) + inl(p.opciones[r.elegida] || '—') + '</span>'
          + (r.ok ? '' : '<br><span class="ok">' + esc(u.rightIs) + inl(p.opciones[p.correcta]) + '</span>') + '<br><span style="color:#5D7691">' + inl(p.explicacion || '') + '</span></div>';
      });
      card.innerHTML = html; s.appendChild(card);
      $('qNew').onclick = function(){ stageClear(); $('setup').scrollIntoView({behavior:'smooth'}); };
      $('qRetry').onclick = function(){ idx = 0; resp = []; pregunta(); };
      $('qPr').onclick = function(){ window.print(); };
      $('qDl').onclick = function(){
        var t = '# ' + C().titulo + '\n\n**' + u.score + ':** ' + ok + '/' + P.length + ' (' + pct + '%)\n\n';
        P.forEach(function(p, i){ var r = resp[i] || {}; t += '## ' + (i + 1) + '. ' + p.enunciado + '\n\n' + p.opciones.map(function(o, k){ return '- ' + String.fromCharCode(65 + k) + ') ' + o + (k === p.correcta ? ' ✓' : '') + (k === r.elegida && !r.ok ? ' ✗' : ''); }).join('\n') + '\n\n> ' + (p.explicacion || '') + '\n\n'; });
        baja(t, nombreFich('.md'));
      };
      card.scrollIntoView({behavior:'smooth', block:'start'});
    }
    $('run').onclick = function(){
      var d = recoge(); if(!d) return;
      ocupado(true); say(T().gen, 'wait');
      apiJSON([{role:'system', content: sistema(formato(d.n || 5))}, {role:'user', content: d.texto || T().start}], 3000)
        .then(function(j){
          P = (j.preguntas || []).filter(function(p){ return p && p.enunciado && Array.isArray(p.opciones) && p.opciones.length >= 2 && p.correcta >= 0 && p.correcta < p.opciones.length; })
            .map(function(p){ p.correcta = parseInt(p.correcta, 10); return p; });
          if(!P.length) throw new Error('__JSON__');
          idx = 0; resp = []; say(T().ready, 'ok'); pregunta();
        })
        .catch(function(e){ say(errMsg(e), 'err'); }).then(function(){ ocupado(false); });
    };
    MODO.repinta = function(){ if(P.length && idx < P.length && $('opts')){ pregunta(); } };
  }

  /* 4 · TARJETAS */
  function modoTarjetas(){
    var D = [], cola = [], sabidas = 0, intentos = 0;
    function formato(n){ return 'Genera exactamente ' + n + ' tarjetas de estudio. Devuelve EXCLUSIVAMENTE un objeto JSON con esta forma: {"tarjetas":[{"anverso":"","reverso":"","pista":""}]}. "pista" puede quedar vacía. Sin markdown dentro de los textos.'; }
    function tarjeta(){
      var s = stageClear(), u = T();
      if(!cola.length){ fin(); return; }
      var t = D[cola[0]];
      var card = el('div', 'card');
      card.innerHTML = '<div class="qtop"><span>' + esc(u.card) + ' ' + (D.length - cola.length + 1) + ' ' + esc(u.of) + ' ' + D.length + '</span><span class="sp"></span><span>✓ ' + sabidas + ' ' + esc(u.known) + '</span></div>'
        + '<div class="bar"><span style="width:' + Math.round(sabidas / D.length * 100) + '%"></span></div>'
        + '<div class="flip" id="flip" tabindex="0" role="button"><div class="flip-in"><div class="face front"><small>' + esc(u.front) + '</small><div>' + inl(t.anverso) + '</div>'
        + (t.pista ? '<button class="hintb" type="button" id="hintB">💡 ' + esc(u.hint) + '</button>' : '') + '</div>'
        + '<div class="face back"><small>' + esc(u.back) + '</small><div>' + inl(t.reverso) + '</div></div></div></div>'
        + '<p class="tapnote">' + esc(u.tap) + '</p>'
        + '<div class="row center" style="margin-bottom:14px"><button class="gh bad2" type="button" id="dAgain">' + esc(u.again) + '</button><button class="go ok2" type="button" id="dKnow">' + esc(u.know) + '</button></div>'
        + '<div class="row center noprint"><button class="gh" type="button" id="dSh">🔀 ' + esc(u.shuffle) + '</button><button class="gh" type="button" id="dCsv">⬇ ' + esc(u.csv) + '</button></div>';
      s.appendChild(card);
      var f = $('flip');
      f.onclick = function(ev){ if(ev.target && ev.target.id === 'hintB') return; f.classList.toggle('on'); };
      f.onkeydown = function(ev){ if(ev.key === ' ' || ev.key === 'Enter'){ ev.preventDefault(); f.classList.toggle('on'); } };
      if($('hintB')) $('hintB').onclick = function(ev){ ev.stopPropagation(); this.textContent = '💡 ' + t.pista; };
      $('dKnow').onclick = function(){ intentos++; sabidas++; cola.shift(); tarjeta(); };
      $('dAgain').onclick = function(){ intentos++; cola.push(cola.shift()); tarjeta(); };
      $('dSh').onclick = function(){ baraja(cola); tarjeta(); };
      $('dCsv').onclick = csv;
      f.focus({preventScroll:true});
    }
    function csv(){
      var q = function(x){ return '"' + String(x || '').replace(/"/g,'""') + '"'; };
      baja(D.map(function(t){ return q(t.anverso) + ',' + q(t.reverso + (t.pista ? ' (' + t.pista + ')' : '')); }).join('\n'), nombreFich('.csv'), 'text/csv');
    }
    function fin(){
      var s = stageClear(), u = T();
      var card = el('div', 'card', '<div style="text-align:center;font-size:54px">🎉</div><h2 style="text-align:center;margin:4px 0">' + esc(u.done) + '</h2><p style="text-align:center;color:#5D7691">' + esc(u.doneS) + intentos + ' · ' + D.length + ' ' + esc(u.known) + '</p>'
        + '<div class="row center"><button class="go" type="button" id="dRe">' + esc(u.restart) + '</button><button class="gh" type="button" id="dNew">' + esc(u.newD) + '</button><button class="gh" type="button" id="dCsv2">' + esc(u.csv) + '</button></div>');
      s.appendChild(card);
      $('dRe').onclick = function(){ cola = D.map(function(_, i){ return i; }); sabidas = 0; intentos = 0; tarjeta(); };
      $('dNew').onclick = function(){ stageClear(); $('setup').scrollIntoView({behavior:'smooth'}); };
      $('dCsv2').onclick = csv;
    }
    $('run').onclick = function(){
      var d = recoge(); if(!d) return;
      ocupado(true); say(T().gen, 'wait');
      apiJSON([{role:'system', content: sistema(formato(d.n || 10))}, {role:'user', content: d.texto || T().start}], 2600)
        .then(function(j){
          D = (j.tarjetas || []).filter(function(t){ return t && t.anverso && t.reverso; });
          if(!D.length) throw new Error('__JSON__');
          cola = D.map(function(_, i){ return i; }); sabidas = 0; intentos = 0;
          say(T().ready, 'ok'); tarjeta(); $('stage').scrollIntoView({behavior:'smooth', block:'start'});
        })
        .catch(function(e){ say(errMsg(e), 'err'); }).then(function(){ ocupado(false); });
    };
    MODO.repinta = function(){ if(D.length && $('flip')) tarjeta(); };
  }

  /* 5 · MÉTODO FEYNMAN */
  function modoFeynman(){
    var ctx = '', concepto = '', rondas = [], borrador = '', fase = 0;
    var FMT = 'Evalúa la explicación del estudiante. Devuelve EXCLUSIVAMENTE un objeto JSON con esta forma: {"puntuaciones":{"claridad":0,"precision":0,"completitud":0,"sencillez":0},"resumen":"","fortalezas":[],"lagunas":[],"errores":[],"jerga":[],"preguntas":[],"siguiente_paso":""}. Puntuaciones enteras de 0 a 10. Máximo 3 elementos por lista; deja la lista vacía si no aplica. "jerga": términos técnicos que usa sin explicar. "preguntas": 2 o 3 preguntas ingenuas pero certeras que haría alguien sin formación en la materia. No reescribas la explicación por el estudiante. Sin markdown dentro de los textos.';
    function pasos(n){
      var u = T();
      return '<div class="fsteps">' + [u.st1, u.st2, u.st3, u.st4].map(function(t, i){ return '<div class="fstep' + (i === n ? ' on' : i < n ? ' done' : '') + '"><i>' + (i < n ? '✓' : i + 1) + '</i>' + esc(t) + '</div>'; }).join('') + '</div>';
    }
    function media(p){ p = p || {}; var k = ['claridad','precision','completitud','sencillez'], s = 0; k.forEach(function(x){ s += +p[x] || 0; }); return Math.round(s / 4 * 10) / 10; }
    function lista(t, arr, cls){ arr = (arr || []).filter(Boolean); if(!arr.length) return ''; return '<div class="lst ' + cls + '"><b>' + esc(t) + '</b><ul>' + arr.map(function(x){ return '<li>' + inl(x) + '</li>'; }).join('') + '</ul></div>'; }
    function explicar(){
      fase = rondas.length ? 3 : 1;
      var s = stageClear(), u = T();
      var card = el('div', 'card');
      card.innerHTML = pasos(fase) + '<p class="concept">' + esc(u.concept) + '</p><h2>' + esc(concepto) + '</h2>'
        + (rondas.length ? '<p style="margin:0 0 12px;color:#5D7691">' + esc(u.round) + ' ' + (rondas.length + 1) + '</p>' : '')
        + '<label for="expl">' + esc(u.explL) + '</label><textarea id="expl" style="min-height:190px" placeholder="' + esc(u.explPh) + '"></textarea>'
        + '<div class="wc" id="wc">0 ' + esc(u.words) + '</div>'
        + '<div class="row"><button class="go" type="button" id="fGo">🔍 ' + esc(u.analyze) + '</button><span class="msg" id="fmsg"></span></div>';
      s.appendChild(card);
      var ta = $('expl'); ta.value = borrador;
      var cuenta = function(){ var n = (ta.value.trim().match(/\S+/g) || []).length; $('wc').textContent = n + ' ' + u.words; borrador = ta.value; return n; };
      ta.oninput = cuenta; cuenta();
      $('fGo').onclick = function(){
        if(cuenta() < 30){ $('fmsg').textContent = u.minW; $('fmsg').className = 'msg err'; return; }
        $('fGo').disabled = true; $('fmsg').innerHTML = '<span class="spin"></span>' + esc(u.gen); $('fmsg').className = 'msg';
        var prev = rondas.length ? '\n\nPuntuaciones de la ronda anterior: ' + JSON.stringify(rondas[rondas.length - 1].r.puntuaciones) + '. Comenta brevemente en "resumen" si ha mejorado.' : '';
        apiJSON([{role:'system', content: sistema(FMT, ctx)}, {role:'user', content: 'Ronda ' + (rondas.length + 1) + '. Explicación del estudiante:\n"""\n' + ta.value.trim() + '\n"""' + prev}], 2000)
          .then(function(j){ rondas.push({texto: ta.value.trim(), r: j}); resultado(); })
          .catch(function(e){ $('fmsg').textContent = errMsg(e); $('fmsg').className = 'msg err'; $('fGo').disabled = false; });
      };
      ta.focus({preventScroll:true});
      card.scrollIntoView({behavior:'smooth', block:'start'});
    }
    function resultado(){
      fase = 2;
      var s = stageClear(), u = T(), R = rondas[rondas.length - 1].r || {}, P = R.puntuaciones || {};
      var html = pasos(2) + '<p class="concept">' + esc(u.concept) + ' · ' + esc(u.round) + ' ' + rondas.length + '</p><h2>' + esc(concepto) + '</h2>'
        + (R.resumen ? '<p style="font-size:16px;margin:0 0 12px">' + inl(R.resumen) + '</p>' : '')
        + '<div class="crit">' + ['claridad','precision','completitud','sencillez'].map(function(k){ var v = Math.max(0, Math.min(10, +P[k] || 0)); return '<div><div class="lb"><span>' + esc(u.crit[k]) + '</span><span>' + v + '/10</span></div><div class="bar"><span style="width:' + (v * 10) + '%"></span></div></div>'; }).join('') + '</div>';
      var qs = (R.preguntas || []).filter(Boolean);
      if(qs.length) html += '<div class="curious"><span class="av">🤔</span><div class="qs"><b style="font-size:14px">' + esc(u.curious) + '</b>' + qs.map(function(q){ return '<div class="q">' + inl(q) + '</div>'; }).join('') + '</div></div>';
      html += '<div class="lists">' + lista(u.strengths, R.fortalezas, 'g') + lista(u.gaps, R.lagunas, 'y') + lista(u.errors, R.errores, 'r') + lista(u.jargon, R.jerga, '') + '</div>';
      if(R.siguiente_paso) html += '<div class="next"><b>👉 ' + esc(u.nextStep) + ':</b> ' + inl(R.siguiente_paso) + '</div>';
      if(rondas.length > 1){
        html += '<h3 style="margin:18px 0 26px">' + esc(u.evo) + '</h3><div class="evo">' + rondas.map(function(r){ var m = media(r.r.puntuaciones); return '<div style="height:' + (m * 10) + '%"><span>' + m + '</span></div>'; }).join('') + '</div>'
          + '<div class="evol">' + rondas.map(function(_, i){ return '<span>' + esc(u.round) + ' ' + (i + 1) + '</span>'; }).join('') + '</div>';
      }
      html += '<div class="row noprint" style="margin-top:18px"><button class="go" type="button" id="fImp">✍️ ' + esc(u.improve) + '</button><button class="gh" type="button" id="fDl">' + esc(u.dlF) + '</button><button class="gh" type="button" id="fNew">' + esc(u.newC) + '</button></div>';
      var card = el('div', 'card', html); s.appendChild(card);
      $('fImp').onclick = explicar;
      $('fNew').onclick = function(){ rondas = []; borrador = ''; concepto = ''; fase = 0; inicial(); $('setup').classList.remove('hide'); $('setup').scrollIntoView({behavior:'smooth'}); };
      $('fDl').onclick = function(){
        var t = '# ' + C().titulo + ' — ' + concepto + '\n\n';
        rondas.forEach(function(r, i){
          var p = r.r.puntuaciones || {};
          t += '## ' + u.round + ' ' + (i + 1) + '\n\n' + r.texto + '\n\n' + ['claridad','precision','completitud','sencillez'].map(function(k){ return '- ' + u.crit[k] + ': ' + (p[k] || 0) + '/10'; }).join('\n') + '\n\n'
            + [[u.gaps, r.r.lagunas], [u.errors, r.r.errores], [u.curious, r.r.preguntas]].map(function(x){ return (x[1] && x[1].length) ? '**' + x[0] + '**\n' + x[1].map(function(y){ return '- ' + y; }).join('\n') + '\n' : ''; }).join('\n') + '\n';
        });
        baja(t, nombreFich('.md'));
      };
      card.scrollIntoView({behavior:'smooth', block:'start'});
    }
    $('run').onclick = function(){
      var d = recoge(); if(!d) return;
      ctx = d.texto; concepto = d.primero || C().titulo; rondas = []; borrador = '';
      say('', ''); $('setup').classList.add('hide'); explicar();
    };
    function inicial(){ $('stage').innerHTML = '<div class="card" style="padding:14px 16px 0">' + pasos(0) + '</div>'; }
    MODO.repinta = function(){ if(!concepto){ inicial(); return; } if(fase === 2 && rondas.length) resultado(); else if($('expl')) explicar(); };
    inicial();
  }

  ({generador:modoGenerador, chat:modoChat, quiz:modoQuiz, tarjetas:modoTarjetas, feynman:modoFeynman}[TIPO] || modoGenerador)();
  pinta();
})();
<\/script>
</body>
</html>
</script>

<script>
(function(){

/* ══ Navegación ══ */
function puedeIr(n){
  if(n <= 2) return true;
  if(n === 3) return !!S.tipo;

}
function motivo(n){ return n === 3 ? t('need_type') : t('need_spec'); }
function pintaStepper(){
  var nav = $('stepper'), st = t('st'), ico = ['', 'key','grid','pencil','sliders','play','rocket'];
  var h = '';
  for(var i = 1; i <= 6; i++){
    var state = i === S.step ? 'now' : i < S.step ? 'done' : '';

      + '<span class="n">' + (state === 'done' ? ic('check') : i) + '</span><span class="lbl">' + esc(st[i]) + '</span></button>';
    if(i < 6) h += '<span class="sline' + (i < S.step ? ' on' : '') + '"></span>';
  }
  nav.innerHTML = h;
  qsa('[data-go]', nav).forEach(function(b){ b.onclick = function(){ ir(+b.dataset.go); }; });
  $('progBar').style.width = (S.step / 6 * 100) + '%';
}
function ir(n){
  if(!puedeIr(n)){ toast(motivo(n)); return; }
  S.step = n; S.max = Math.max(S.max, n);

  guarda();
}
function entra(n, soloPinta){

}

/* ══ Llamadas a OpenAI desde ForjaIA ══ */
function razona(m){ return /^(gpt-[56]|o[134])/.test(m || ''); }
function cuerpo(modelo, mensajes, maxTok, json){
  var b = {model: modelo, messages: mensajes};
  if(json) b.response_format = {type:'json_object'};
  if(razona(modelo)){ b.reasoning_effort = 'low'; b.max_completion_tokens = (maxTok || 1600) * 4; }
  else { b.temperature = 0.6; b.max_tokens = maxTok || 1600; }
  return b;
}
function llama(mensajes, maxTok){
  var key = LSX.get(KEY) || $('apikey').value.trim();
  if(!key) return Promise.reject(new Error('__NOKEY__'));
  return fetch('https://api.openai.com/v1/chat/completions', {
    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer ' + key},
    body: JSON.stringify(cuerpo($('modelo').value || 'gpt-6-luna', mensajes, maxTok, true))
  }).then(function(r){
    if(!r.ok) return r.json().catch(function(){ return {}; }).then(function(e){ throw new Error((e.error && e.error.message) || ('Error ' + r.status)); });
    return r.json();
  }).then(function(d){
    var txt = (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || '';
    if(!txt.trim()) throw new Error('__VACIO__');
    try{ return JSON.parse(txt); }catch(e){ var m = txt.match(/\{[\s\S]*\}/); if(m) return JSON.parse(m[0]); throw e; }
  });
}
function errorLegible(e){
  var m = (e && e.message) || '';
  if(m === '__NOKEY__') return t('st_nokey');
  if(m === '__VACIO__') return t('st_vacio');
  if(/quota|billing/i.test(m)) return t('st_quota');
  if(/Incorrect API key|invalid_api_key/.test(m)) return t('st_badkey');
  return m || 'Error';
}

/* ══ Normalización ══ */
function slugify(s){
  return (s || 'mi-app').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40) || 'mi-app';
}
function normCampo(c, i){
  c = c || {};
  var id = String(c.id || ('campo' + (i + 1))).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9_]/g,'_') || ('campo' + (i + 1));
  return {id:id, label: c.label || ('Campo ' + (i + 1)), tipo: ['text','textarea','select','number'].indexOf(c.tipo) > -1 ? c.tipo : 'text',
    placeholder: c.placeholder || '', opciones: Array.isArray(c.opciones) ? c.opciones.map(String).filter(Boolean) : [], requerido: c.requerido !== false};
}
function idsUnicos(campos){
  var vistos = {};
  campos.forEach(function(c, i){ var b = c.id, n = 2; while(vistos[c.id]){ c.id = b + '_' + n++; } vistos[c.id] = 1; });
  return campos;
}
function defectosTipo(s, soloFaltan){
  s.opciones = s.opciones || {};
  if(s.tipo === 'quiz'){ s.opciones.n = +s.opciones.n || 5; if(['multiple','vf','mixta'].indexOf(s.opciones.formato) < 0) s.opciones.formato = 'multiple'; }
  if(s.tipo === 'tarjetas'){ s.opciones.n = +s.opciones.n || 10; }
  if(s.tipo === 'generador' && s.opciones.refinar === undefined) s.opciones.refinar = true;
  if(s.tipo === 'chat'){
    if(!s.evaluacion) s.evaluacion = t('blank_eval');
    if(!Array.isArray(s.sugerencias)) s.sugerencias = [];
    if(s.bienvenida == null) s.bienvenida = '';
  }
  if(s.tipo !== 'chat' && !s.campos.length) s.campos = [normCampo({id:'tema', label:t('blank_c'), tipo:'text', placeholder:t('blank_cph'), requerido:true}, 0)];
  if(s.tipo === 'feynman' && s.campos.length) s.campos[0].requerido = true;
  if(!soloFaltan) s.color = TCOL[s.tipo];
  return s;
}
function normaliza(s, tipo, base){
  s = s || {};
  s.tipo = tipo || s.tipo || 'generador';
  s.titulo = s.titulo || t('blank_t');
  s.slug = slugify(s.slug || s.titulo);
  s.subtitulo = s.subtitulo || '';
  s.instrucciones = s.instrucciones || '';
  s.icono = (typeof s.icono === 'string' && s.icono.trim() && s.icono.length <= 8) ? s.icono.trim() : TEMO[s.tipo];
  s.color = /^#[0-9a-fA-F]{6}$/.test(s.color || '') ? s.color : TCOL[s.tipo];
  s.systemPrompt = s.systemPrompt || '';
  s.instruccionSalida = s.instruccionSalida || '';
  s.botonLabel = s.botonLabel || t('blank_btn');
  s.modelo = s.modelo || LSX.get(MKEY) || 'gpt-6-luna';
  s.campos = idsUnicos((Array.isArray(s.campos) ? s.campos : []).map(normCampo));
  s.opciones = s.opciones || {};
  if(s.n) s.opciones.n = +s.n; if(s.formato) s.opciones.formato = s.formato; if(s.refinar !== undefined) s.opciones.refinar = !!s.refinar;
  delete s.n; delete s.formato; delete s.refinar;
  s.sugerencias = Array.isArray(s.sugerencias) ? s.sugerencias.filter(Boolean).map(String) : [];
  s.bienvenida = s.bienvenida || ''; s.evaluacion = s.evaluacion || '';
  defectosTipo(s, true);
  s.base = base || s.base || lang;

function idiomasActivos(s){ return [s.base].concat(s.otros.filter(function(l){ return s.trad[l].incluir && s.trad[l].titulo; })); }
function construye(s, previewKey){
  var tpl = document.getElementById('appTemplate').textContent.replace(/<\\\/script/g, '<\/script');
  var pie = [s.autor, s.institucion, s.pais].filter(Boolean).join(' · ') || t('autoria');
  var idiomas = idiomasActivos(s);
  var i18n = {};
  var txt = function(src, c2){ return {titulo:src.titulo, subtitulo:src.subtitulo, instrucciones:src.instrucciones, boton:src.botonLabel, bienvenida:src.bienvenida, sugerencias:src.sugerencias, campos:c2}; };
  i18n[s.base] = txt(s, s.campos.map(function(c){ return {label:c.label, placeholder:c.placeholder, opciones:c.opciones}; }));
  idiomas.filter(function(l){ return l !== s.base; }).forEach(function(l){
    var tr = s.trad[l];
    i18n[l] = {
      titulo: tr.titulo || s.titulo, subtitulo: tr.subtitulo || s.subtitulo, instrucciones: tr.instrucciones || s.instrucciones, boton: tr.botonLabel || s.botonLabel,
      bienvenida: tr.bienvenida || s.bienvenida, sugerencias: (tr.sugerencias && tr.sugerencias.length) ? tr.sugerencias : s.sugerencias,
      campos: s.campos.map(function(c, i){ var x = tr.campos[i] || {}; return {label:x.label || c.label, placeholder:x.placeholder || c.placeholder, opciones:(x.opciones && x.opciones.length) ? x.opciones : c.opciones}; })
    };
  });
  var payload = {forja:2, tipo:s.tipo, slug:s.slug, modelo:s.modelo, icono:s.icono, color:s.color, systemPrompt:s.systemPrompt, instruccionSalida:s.instruccionSalida,
    evaluacion: s.tipo === 'chat' ? s.evaluacion : '', opciones:s.opciones, base:s.base, idiomas:idiomas,
    autor:s.autor, institucion:s.institucion, pais:s.pais, orcid:s.orcid, licencia:s.licencia,
    campos: s.campos.map(function(c){ return {id:c.id, tipo:c.tipo, opciones:c.opciones, requerido:c.requerido}; }), i18n:i18n};
  var color = /^#[0-9a-fA-F]{6}$/.test(s.color) ? s.color : '#E4572E';
  var escA = function(x){ return esc(x); };
  var out = tpl
    .replace(/__TITULO__/g, function(){ return escA(s.titulo); })
    .replace(/__SUBTITULO__/g, function(){ return escA(s.subtitulo); })
    .replace(/__PIE__/g, function(){ return escA(pie); })
    .replace(/__ICONO__/g, function(){ return escA(s.icono); })
    .replace(/__COLOR__/g, function(){ return color; })
    .replace('__SPEC__', function(){ return JSON.stringify(payload).replace(/</g, '\\u003c'); });
  if(previewKey !== undefined){
    out = out.replace('var PREVIEW = null; /*__PREVIEW__*/', function(){ return 'var PREVIEW = ' + JSON.stringify({key: previewKey || ''}).replace(/</g, '\\u003c') + ';'; });
  }
  return out.trim();
}

/* ZIP sin compresión (método «store») */
var CRC = (function(){ var tb = []; for(var n = 0; n < 256; n++){ var c = n; for(var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; tb[n] = c >>> 0; } return tb; })();
function crc32(u8){ var c = 0xFFFFFFFF; for(var i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zip(files){
  var enc = new TextEncoder(), partes = [], central = [], off = 0, d = new Date();
  var tm = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), dt = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  files.forEach(function(f){
    var nm = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
    var h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, tm, true); h.setUint16(12, dt, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);
    h.setUint16(26, nm.length, true); h.setUint16(28, 0, true);
    partes.push(new Uint8Array(h.buffer), nm, data);
    var c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, tm, true); c.setUint16(14, dt, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
    c.setUint16(28, nm.length, true); c.setUint16(30, 0, true); c.setUint16(32, 0, true); c.setUint16(34, 0, true); c.setUint16(36, 0, true); c.setUint32(38, 0, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), nm);
    off += 30 + nm.length + data.length;
  });
  var tamC = central.reduce(function(a, b){ return a + b.length; }, 0);
  var e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, tamC, true); e.setUint32(16, off, true);
  return new Blob(partes.concat(central, [new Uint8Array(e.buffer)]), {type:'application/zip'});
}

$('fileOpen').onchange = function(){
  var f = this.files && this.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    var txt = String(rd.result || '');
    try{
      if(/\.json$/i.test(f.name) || /^\s*\{/.test(txt)){
        var j = JSON.parse(txt);
        if(!j.S) throw new Error('x');
        S = Object.assign(estadoVacio(), j.S); toast('📂 ' + t('st_opened')); ir(S.spec ? 4 : Math.max(1, S.step));
      } else {
        var m = txt.match(/<script id="spec" type="application\/json">([\s\S]*?)<\/script>/);
        if(!m) throw new Error('x');
        var p = JSON.parse(m[1]);
        var b = p.base || 'es', tx = (p.i18n && p.i18n[b]) || {};
        var col = p.color || ((txt.match(/--b:(#[0-9a-fA-F]{6})/) || [])[1]);
        var pie = ((txt.match(/<span id="pie">([\s\S]*?)<\/span>/) || [])[1] || '').split(' · ');
        var sp = {tipo:p.tipo || 'generador', slug:p.slug, titulo:tx.titulo, subtitulo:tx.subtitulo, instrucciones:tx.instrucciones, botonLabel:tx.boton,
          bienvenida:tx.bienvenida, sugerencias:tx.sugerencias, systemPrompt:p.systemPrompt, instruccionSalida:p.instruccionSalida, evaluacion:p.evaluacion,
          opciones:p.opciones || {}, modelo:p.modelo, icono:p.icono, color:col,
          autor:p.autor || pie[0] || '', institucion:p.institucion || pie[1] || '', pais:p.pais || pie[2] || '', orcid:p.orcid || '', licencia:p.licencia,
          campos:(p.campos || []).map(function(c, i){ var l = (tx.campos || [])[i] || {}; return {id:c.id, tipo:c.tipo, opciones:c.opciones, requerido:c.requerido, label:l.label, placeholder:l.placeholder}; })};
        if(sp.autor === t('autoria')) sp.autor = '';
        var tr = {};
        (p.idiomas || []).filter(function(l){ return l !== b; }).forEach(function(l){
          var x = p.i18n[l] || {};
          tr[l] = {titulo:x.titulo || '', subtitulo:x.subtitulo || '', instrucciones:x.instrucciones || '', botonLabel:x.boton || '', bienvenida:x.bienvenida || '', sugerencias:x.sugerencias || [], campos:(x.campos || []).map(function(c){ return {label:c.label || '', placeholder:c.placeholder || '', opciones:c.opciones || []}; }), incluir:true};
        });
        sp.trad = tr;
        S = estadoVacio(); S.tipo = sp.tipo; S.spec = normaliza(sp, sp.tipo, b); S.max = 6;
        toast('📂 ' + t('st_imported')); ir(4);
      }
    }catch(e){ toast('⚠️ ' + t('st_badfile')); }
  };
  rd.readAsText(f);
  this.value = '';
};
